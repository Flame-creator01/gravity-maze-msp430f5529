name: host-tests

# The firmware itself needs TI CCS, but every piece of logic that is not raw
# register access also runs on a normal C compiler. This workflow proves that
# the code still builds and all host-side regression suites pass.

on:
  push:
    branches: [main, master]
  pull_request:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install gcc
        run: |
          sudo apt-get update
          sudo apt-get install -y gcc

      - name: Run host regression suites
        shell: pwsh
        run: ./tools/test_host.ps1 -BuildDirectory "$env:RUNNER_TEMP/hostbuild"
